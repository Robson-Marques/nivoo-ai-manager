name: One-off recovery validation
# Validar configuração Jest definitiva e regressões.
# Reexecução após alinhar os testes de regressão com a entrega determinística.
on:
  push:
    branches:
      - fix/workflow-progressive-recovery-20261122
    paths:
      - .github/workflows/recovery-validation-once.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nivoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nivoo_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/nivoo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run build -w apps/backend
      # Exercita também a execução pela raiz do repositório, que antes falhava por tsconfig.
      - run: npx jest --config apps/backend/jest.config.js --runInBand --runTestsByPath apps/backend/test/unit/recovery-signature.spec.ts apps/backend/test/unit/motion-capture-freshness.spec.ts
      - run: npx jest --runInBand --runTestsByPath test/acceptance/22-ate-o-fim-e-ia-reserva.spec.ts
        working-directory: apps/backend
