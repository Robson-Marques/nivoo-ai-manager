name: CI

# Manual only. Prevent CI emails and expensive runs on every push.
on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches: [feature/studio-editor-workspace-v5]

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/motion-workflow-boundaries'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nivoo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nivoo_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/nivoo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Mesmas dependências de sistema que o instalador usa (ffmpeg para vídeo; poppler/tesseract para texto e OCR;
      # DejaVu para as legendas; zip para os testes de .zip; ripgrep). python3-pil só os TESTES usam, para gerar um
      # PDF "escaneado" de mentira (o app lê PDF com poppler/tesseract, não com PIL).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils tesseract-ocr tesseract-ocr-por fonts-dejavu-core zip unzip ripgrep python3-pil
      - run: npm ci
      # Navegador do Playwright (motion design, fotos das telas, roteiros): o core não baixa sozinho.
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: git config --global user.email ci@localhost && git config --global user.name ci
      - run: bash -n deploy/nivoo deploy/install-debian.sh deploy/backup-retention.sh
      - run: npm test
      - run: npm run build -w apps/web
